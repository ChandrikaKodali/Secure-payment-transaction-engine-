apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: payment-api}
  template:
    metadata: {labels: {app: payment-api}}
    spec:
      containers:
        - name: api
          image: secure-payment-engine-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef:
                name: payment-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  selector: {app: payment-api}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
type: Opaque
stringData:
  API_KEY: replace-me
  DB_HOST: payment-postgres
  DB_PORT: "5432"
  DB_NAME: payment_engine
  DB_USER: postgres
  DB_PASSWORD: postgres
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: payment-events
