apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-postgres}
  template:
    metadata: {labels: {app: payment-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: payment_engine
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-postgres
spec:
  selector: {app: payment-postgres}
  ports: [{port: 5432, targetPort: 5432}]
